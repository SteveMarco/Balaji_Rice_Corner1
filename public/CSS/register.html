<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Fresh Grain Store</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="subtitle">After registration, admin approval is required to view live pricing.</p>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name / Business Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number (for WhatsApp Orders)</label>
                    <input type="tel" id="phone" class="form-control" placeholder="9876543210" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Register Account</button>
            </form>
            <p style="margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted); text-align: center;">
                Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 700;">Sign In</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert(data.message);
                window.location.href = '/login.html';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
